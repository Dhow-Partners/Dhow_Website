<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Dhow Partners</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<script>
  // Static hosts (e.g. GitHub Pages) serve this file for any unknown path.
  // Hand the path to the site so real pages (/services, /about...) open, and unknown ones show the branded 404.
  (function(){var l=window.location;if(l.protocol==='file:'||/\/404(\.html)?$/i.test(l.pathname)||/\.html?$/i.test(l.pathname))return;l.replace(l.protocol+'//'+l.host+'/?p='+encodeURIComponent(l.pathname+l.search)+l.hash);})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EEF3F1;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#00395F;text-align:center;padding:24px;box-sizing:border-box}
  a{color:#FFFFFF;background:#00395F;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:600;display:inline-block;margin-top:24px}
  a:hover{background:#00846D;color:#FFFFFF}
  b{display:block;font-size:96px;line-height:1;color:#00846D;letter-spacing:-0.04em}
  h1{margin:16px 0 8px;font-size:32px;letter-spacing:-0.02em}
  p{margin:0;color:#3E5568}
</style>
</head>
<body>
  <main>
    <b>404</b>
    <h1>We couldn't find that page.</h1>
    <p>It may have moved, or the link may be mistyped.</p>
    <a href="/">Back to Dhow Partners</a>
  </main>
</body>
</html>
